name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      # v1.2.3 or v1.2.3-rc.1. Android needs an increasing integer as well:
      # 1.2.3 becomes 1002003.
      - id: version
        run: |
          pattern='^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$GITHUB_REF_NAME" =~ $pattern ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          code=$((BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3]))
          echo "code=$code" >> "$GITHUB_OUTPUT"

  appimage:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Must match devEngines in the root package.json.
      - run: npm install -g npm@11.16.0

      - run: sudo apt-get update && sudo apt-get install -y rclone

      - run: npm ci

      - run: npx turbo run lint check-types test --filter=note-desktop --filter=@repo/notes

      - run: npm run dist --workspace note-desktop -- -c.extraMetadata.version="$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      # Fail early: an unsigned APK can't be installed.
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Android signing secrets are missing; see README.md"
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Must match devEngines in the root package.json.
      - run: npm install -g npm@11.16.0

      - run: sudo apt-get update && sudo apt-get install -y rclone

      - run: npm ci

      - run: npx turbo run lint check-types test --filter=note-android --filter=@repo/notes

      - run: npm run sync --workspace note-android

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Test and build the signed APK
        working-directory: apps/android/android
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleRelease
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Note-$VERSION_NAME.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/Note-*.apk
          if-no-files-found: error

  # Only runs once both builds have succeeded.
  release:
    needs: [appimage, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.AppImage *.apk > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" "${flags[@]}"
