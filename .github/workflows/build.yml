name: Build apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Must match devEngines in the root package.json.
      - run: npm install -g npm@11.16.0

      - run: sudo apt-get update && sudo apt-get install -y rclone

      - run: npm ci

      - run: npx turbo run lint check-types test --filter=note-desktop --filter=@repo/notes

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Note-AppImage
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Must match devEngines in the root package.json.
      - run: npm install -g npm@11.16.0

      - run: sudo apt-get update && sudo apt-get install -y rclone

      - run: npm ci

      - run: npx turbo run lint check-types test --filter=note-android --filter=@repo/notes

      - run: npm run apk

      - run: ./gradlew testDebugUnitTest lintDebug
        working-directory: apps/android/android

      - uses: actions/upload-artifact@v4
        with:
          name: Note-Android-debug
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
